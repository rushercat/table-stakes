# Render Blueprint — https://render.com/docs/blueprint-spec
# New > Blueprint > pick this repository, and Render builds and runs the app from this file.
services:
  - type: web
    name: table-stakes
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
